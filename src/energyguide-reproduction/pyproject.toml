[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energyguide-reproduction"
version = "0.1.0"
description = "Auditable reconstruction of the local Energy-Guided path-planning manuscript"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.scripts]
energyguide = "energyguide.cli:main"

[tool.setuptools.packages.find]
include = ["energyguide*"]
